<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap"
      rel="stylesheet"
    />
    <link href="./assest/css/main.css" rel="stylesheet" />
    <style>
      .slider-container {
        width: 100%; /* Full width */
        overflow: hidden; /* Hide the overflow */
        white-space: nowrap; /* Prevent text wrapping */
        font-weight: 700;
        position: relative;
        font-family: "Poppins", system-ui;
        z-index: 0;
      }

      .slider-track {
        display: inline-block;
        white-space: nowrap;
        animation: slide-left 15s linear infinite; /* Continuous sliding */
      }

      .slider-text {
        display: inline-block;
        font-size: 80px;
        letter-spacing: 0px;
        margin-right: 50px; /* Adjust this value to control the gap */
        color: #00000000 !important;
        -webkit-text-stroke: 2px #ffffff12; /* Adds a border directly around the text */
      }

      @keyframes slide-left {
        0% {
          transform: translateX(0%); /* Start at normal position */
        }
        100% {
          transform: translateX(-50%); /* Slide out completely */
        }
      }

      /*TWO*/
      .slider-container-two {
        width: 100%; /* Full width */
        overflow: hidden; /* Hide the overflow */
        white-space: nowrap; /* Prevent text wrapping */
        font-weight: 700;
        position: relative;
        font-family: "Poppins", system-ui;
        z-index: 0;
      }

      .slider-track-two {
        display: inline-block;
        white-space: nowrap;
        animation: slide-right 15s linear infinite; /* Continuous sliding */
      }

      .slider-text-two {
        display: inline-block;
        font-size: 80px;
        letter-spacing: 0px;
        margin-left: 50px; /* Adjust this value to control the gap */
      }

      @keyframes slide-right {
        0% {
          transform: translateX(-50%); /* Start at normal position */
        }
        100% {
          transform: translateX(0%); /* Slide out completely */
        }
      }

      /*THREE*/
      .slider-container-three {
        width: 100%; /* Full width */
        overflow: hidden; /* Hide the overflow */
        white-space: nowrap; /* Prevent text wrapping */
        font-weight: 700;
        position: relative;
        font-family: "Poppins", system-ui;
        z-index: 0;
      }

      .slider-track-three {
        display: inline-block;
        white-space: nowrap;
        animation: slide-left 15s linear infinite; /* Continuous sliding */
      }

      .slider-text-three {
        display: inline-block;
        font-size: 80px;
        letter-spacing: 0px;
        margin-right: 50px; /* Adjust this value to control the gap */
        color: #00000000 !important;
        -webkit-text-stroke: 2px #ffffff12;
      }

      @keyframes slide-left {
        0% {
          transform: translateX(0%); /* Start at normal position */
        }
        100% {
          transform: translateX(-50%); /* Slide out completely */
        }
      }
    </style>
  </head>

  <body>
    <section class="row g-0 p-0 m-0">
      <div id="main" class="home text-center">
        <div id="name" class="profile-image-name">
          <h1 class="m-auto">Hitarth</h1>
        </div>
        <div class="profile-image">
          <img
            src="./assest/img/WhatsApp Image 2024-09-22 at 12.48.41 PM 1.svg"
          />
          <div class="profile-image-bluer">Hii</div>
        </div>
      </div>
      <div class="technology">
        <!-- Continuous slider without gaps -->
        <div class="slider-container">
          <div class="slider-track">
            <span class="slider-text">FLUTTER DEVELOPER</span>
            <span class="slider-text">FLUTTER DEVELOPER</span>
          </div>
        </div>
        <div class="slider-container-two">
          <div class="slider-track-two">
            <span class="slider-text-two">FLUTTER DEVELOPER</span>
            <span class="slider-text-two">FLUTTER DEVELOPER</span>
          </div>
        </div>
        <div class="slider-container-three">
          <div class="slider-track-three">
            <span class="slider-text-three">FLUTTER DEVELOPER</span>
            <span class="slider-text-three">FLUTTER DEVELOPER</span>
          </div>
        </div>
      </div>
    </section>
    <script src="./assest/js/main.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
